name: Build Android APK & Prepare Vercel Portal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Copy APK to public/StudyBuddy.apk for Direct Web Download
        run: cp app/build/outputs/apk/debug/app-debug.apk public/StudyBuddy.apk

      - name: Upload StudyBuddy.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-Android-APK
          path: public/StudyBuddy.apk
